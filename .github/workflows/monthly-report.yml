name: PulseIQ monthly report
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 2 * *" # 05:00 UTC on the 2nd day of each month
permissions:
  contents: read
  actions: read
jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: phase-4/requirements.txt
      - name: Install Phase 4 dependencies
        run: python -m pip install -r phase-4/requirements.txt
      - name: Build report
        run: |
          python phase-4/build_report.py \
            --start 2025-04-01 \
            --end "$(date -u +%Y-%m-%d)" \
            --format both
      - uses: actions/upload-artifact@v4
        with:
          name: pulseiq-monthly-report
          path: phase-4/reports/*
          if-no-files-found: error
          retention-days: 90
