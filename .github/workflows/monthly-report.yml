name: PulseIQ monthly report
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Require approved Phase 3 data bundle
        env:
          PULSEIQ_DATA_BUNDLE_BASE64: ${{ secrets.PULSEIQ_DATA_BUNDLE_BASE64 }}
        run: |
          if [ -z "$PULSEIQ_DATA_BUNDLE_BASE64" ]; then
            echo "::error::Configure PULSEIQ_DATA_BUNDLE_BASE64 with an approved ZIP containing pulseiq.duckdb and the Phase 3 evidence CSVs."
            exit 1
          fi
          mkdir -p phase3-data
          printf '%s' "$PULSEIQ_DATA_BUNDLE_BASE64" | base64 --decode > /tmp/phase3-data.zip
          unzip -q /tmp/phase3-data.zip -d phase3-data
          test -f phase3-data/pulseiq.duckdb
      - name: Install pinned Phase 4 dependencies
        run: python -m pip install -r requirements.txt
      - name: Build report
        env:
          PULSEIQ_DB_PATH: ${{ github.workspace }}/phase3-data/pulseiq.duckdb
        run: |
          python build_report.py --start 2025-04-01 --end "$(date -u +%Y-%m-%d)" --format both
      - uses: actions/upload-artifact@v4
        with:
          name: pulseiq-monthly-report
          path: reports/*
          if-no-files-found: error
          retention-days: 90
