name: Phase 4 completion workspace tests
on:
  push:
    branches: [phase4-complete]
  pull_request:
    branches: [phase4-complete]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase4_complete
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: phase4_complete/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
