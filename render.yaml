# Blueprint starting point. Configure verified identity and persistent data refresh before public use.
services:
  - type: web
    name: pulseiq-metrics-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./phase-4/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PULSEIQ_AUTH_MODE
        value: production
      - key: PULSEIQ_DB_PATH
        value: /app/phase-3/outputs/pulseiq.duckdb
  - type: web
    name: pulseiq-kpi-explorer
    runtime: docker
    dockerContext: .
    dockerfilePath: ./phase-4/Dockerfile
    dockerCommand: streamlit run explorer.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PULSEIQ_DB_PATH
        value: /app/phase-3/outputs/pulseiq.duckdb
      - key: PULSEIQ_AUTH_MODE
        value: production
