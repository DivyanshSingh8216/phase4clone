# Render deployment for a password-gated executive-only dashboard preview.
# Add PULSEIQ_DEMO_PASSWORD as a secret in the Render service environment.
# Upload the approved Phase 3 DuckDB file to /data/pulseiq.duckdb after the disk is mounted.
services:
  - type: web
    name: pulseiq-kpi-explorer
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run explorer.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    disk:
      name: pulseiq-warehouse
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PULSEIQ_DB_PATH
        value: /data/pulseiq.duckdb
      - key: PULSEIQ_DEMO_PASSWORD
        sync: false
