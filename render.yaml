# Deployment template only. Do not expose publicly until SSO, persistent data and live tests are configured.
services:
  - type: web
    name: pulseiq-metrics-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PULSEIQ_AUTH_MODE
        value: production
      - key: PULSEIQ_DB_PATH
        value: /data/pulseiq.duckdb
  - type: web
    name: pulseiq-kpi-explorer
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run explorer.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PULSEIQ_DB_PATH
        value: /data/pulseiq.duckdb
      - key: PULSEIQ_AUTH_MODE
        value: production
